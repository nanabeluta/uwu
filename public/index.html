<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uwu 分享牆</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>uwu 分享牆</h1>
        <p>任何人都可以分享文字與圖片。</p>
      </header>

      <section class="auth-card">
        <div id="authForms" class="auth-stack">
          <div class="auth-switch">
            <button type="button" id="showLoginBtn" class="active">登入</button>
            <button type="button" id="showRegisterBtn">註冊</button>
          </div>

          <form id="loginForm">
            <label for="loginEmail">信箱</label>
            <input id="loginEmail" name="email" type="email" placeholder="example@mail.com" required />

            <label for="loginPassword">密碼</label>
            <input id="loginPassword" name="password" type="password" placeholder="密碼" required />

            <button type="submit">登入</button>
            <div id="loginStatus" class="status"></div>
          </form>

          <form id="registerForm" class="hidden">
            <label for="registerName">名稱</label>
            <input id="registerName" name="name" type="text" placeholder="你的暱稱" required />

            <label for="registerEmail">信箱</label>
            <input id="registerEmail" name="email" type="email" placeholder="example@mail.com" required />

            <label for="registerPassword">密碼</label>
            <input id="registerPassword" name="password" type="password" placeholder="至少 6 個字元" required />

            <button type="submit">註冊</button>
            <div id="registerStatus" class="status"></div>
          </form>
        </div>

        <div id="userPanel" class="user-panel hidden">
          <p>已登入：<strong id="userName"></strong> (<span id="userRole"></span>)</p>
          <div class="user-actions">
            <button id="logoutBtn" type="button">登出</button>
            <a id="adminLink" class="admin-link hidden" href="admin.html">管理者頁面</a>
          </div>
        </div>
      </section>

      <section class="form-card hidden" id="shareSection">
        <form id="shareForm">
          <label for="text">文字內容</label>
          <textarea id="text" name="text" rows="4" placeholder="寫下一段想分享的話..." required></textarea>

          <label for="image">附加圖片（選填）</label>
          <input id="image" name="image" type="file" accept="image/*" />

          <button type="submit">分享貼文</button>
          <div id="status" class="status"></div>
        </form>
      </section>

      <section class="info-card" id="loginRequired">
        <p>請先登入或註冊，然後才能分享貼文與留言。</p>
      </section>

      <section class="posts-card">
        <h2>最新貼文</h2>
        <div id="posts"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
